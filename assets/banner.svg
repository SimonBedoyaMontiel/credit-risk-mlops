<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" width="1600" height="360" role="img" aria-label="Banner de cabecera para el repositorio de Riesgo Crediticio: MLOps, pipeline de producción y validación de matriz de confusión con cero falsas alarmas" style="background:#090d13; font-family:'Charter', 'Bitstream Charter', 'Iowan Old Style', 'Baskerville', 'Georgia', serif;">
  <title>Riesgo Crediticio - MLOps y Pipeline en Producción</title>
  <desc>Sobre 2.153 clientes de prueba, el modelo acierta los 2.051 que sí pagan sin ninguna falsa alarma, y detecta 74 de los 102 que no pagan (recall del 73%).</desc>
  <defs>
    <!-- Background: Deep warm obsidian & slate subtle gradient -->
    <radialGradient id="bgAtmosphere" cx="70%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#121824"/>
      <stop offset="60%" stop-color="#090d13"/>
      <stop offset="100%" stop-color="#05080c"/>
    </radialGradient>

    <!-- Subtle accent glow for perfect precision indicator -->
    <radialGradient id="tealAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle gradient for the minority recall bar -->
    <linearGradient id="barTealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- Base Plate (100% Opaque for GitHub Light & Dark modes) -->
  <rect width="1600" height="360" fill="url(#bgAtmosphere)"/>

  <!-- Precision hairline border -->
  <rect x="0.5" y="0.5" width="1599" height="359" fill="none" stroke="#1c2533" stroke-width="1"/>

  <!-- Architectural Hairline Vertical Rule -->
  <line x1="790" y1="42" x2="790" y2="318" stroke="#182230" stroke-width="1"/>

  <!-- ========================================================================= -->
  <!-- LEFT COLUMN: EDITORIAL TYPOGRAPHY & RIGOROUS DATA SCIENCE HIERARCHY       -->
  <!-- ========================================================================= -->
  <g transform="translate(80, 52)">
    <!-- Kicker / Epígrafe con tipografía mono técnica -->
    <g transform="translate(0, 22)">
      <circle cx="5" cy="-5" r="4" fill="#2dd4bf"/>
      <text x="20" y="0" fill="#2dd4bf" font-size="18" font-weight="700" letter-spacing="3" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace">MLOPS · CREDIT RISK</text>
    </g>

    <!-- Título Principal: Serif editorial con autoridad, presencia y kerning refinado -->
    <text x="0" y="102" fill="#f8fafc" font-size="74" font-weight="800" letter-spacing="-1.5" font-family="'Charter', 'Bitstream Charter', 'Iowan Old Style', 'Baskerville', 'Georgia', serif">
      Riesgo Crediticio
    </text>

    <!-- Subtítulo -->
    <text x="0" y="146" fill="#cbd5e1" font-size="22" font-weight="500" letter-spacing="-0.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      Del análisis exploratorio a una API en producción
    </text>

    <!-- Descriptor técnico -->
    <text x="0" y="188" fill="#718096" font-size="18" font-weight="400" letter-spacing="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      Pipeline completo con FastAPI, Docker y monitoreo de data drift
    </text>

    <!-- Fila de Métricas: En una sola línea horizontal refinada sin cajas pesadas -->
    <g transform="translate(0, 226)">
      <!-- Regla divisoria horizontal fina -->
      <line x1="0" y1="0" x2="640" y2="0" stroke="#1a2434" stroke-width="1"/>

      <!-- Métrica 1: ROC-AUC -->
      <g transform="translate(0, 28)">
        <text x="0" y="0" fill="#64748b" font-size="18" font-weight="600" letter-spacing="1" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace">ROC-AUC</text>
        <text x="115" y="0" fill="#f1f5f9" font-size="21" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace">0,96</text>
      </g>

      <!-- Rombo separador sutil -->
      <polygon points="208,21 212,25 208,29 204,25" fill="#334155"/>

      <!-- Métrica 2: F1 -->
      <g transform="translate(236, 28)">
        <text x="0" y="0" fill="#64748b" font-size="18" font-weight="600" letter-spacing="1" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace">F1</text>
        <text x="46" y="0" fill="#f1f5f9" font-size="21" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace">0,84</text>
      </g>

      <!-- Rombo separador sutil -->
      <polygon points="360,21 364,25 360,29 356,25" fill="#334155"/>

      <!-- Métrica 3: RECALL -->
      <g transform="translate(388, 28)">
        <text x="0" y="0" fill="#64748b" font-size="18" font-weight="600" letter-spacing="1" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace">RECALL</text>
        <text x="100" y="0" fill="#2dd4bf" font-size="21" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace">0,73</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT COLUMN: ELEGANT, UNCLUTTERED CONFUSION MATRIX VALIDATION            -->
  <!-- Espacio negativo cuidado, proporciones exactas y lectura inmediata        -->
  <!-- ========================================================================= -->
  <g transform="translate(850, 50)">

    <!-- Sub-header técnico y sobrio -->
    <g transform="translate(0, 16)">
      <text x="0" y="0" fill="#64748b" font-size="18" font-weight="600" letter-spacing="1" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace">TEST VALIDATION</text>
      <text x="180" y="0" fill="#334155" font-size="18">|</text>
      <text x="198" y="0" fill="#94a3b8" font-size="18" font-weight="500" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace">2.153 CLIENTES</text>

      <!-- Badge minimalista de precisión -->
      <text x="680" y="0" fill="#2dd4bf" font-size="18" font-weight="700" text-anchor="end" letter-spacing="0.8" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace">0 FALSAS ALARMAS</text>
    </g>

    <!-- Línea divisoria técnica -->
    <line x1="0" y1="30" x2="680" y2="30" stroke="#182230" stroke-width="1"/>

    <!-- ================= FILA 1: CLIENTES QUE SÍ PAGAN (2.051 / 2.051) ================= -->
    <g transform="translate(0, 50)">
      <!-- Fondo sutil de respiración con línea lateral esmeralda/teal -->
      <rect x="0" y="0" width="680" height="84" rx="4" fill="#0c141d" stroke="#192638" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="84" rx="2" fill="#2dd4bf"/>

      <!-- Contenido textual izquierdo -->
      <text x="24" y="30" fill="#94a3b8" font-size="18" font-weight="600" letter-spacing="0.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">CLIENTES QUE SÍ PAGAN</text>
      <text x="250" y="30" fill="#475569" font-size="18" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">· Clase mayoritaria (95%)</text>

      <text x="24" y="66" fill="#f8fafc" font-size="28" font-weight="800" font-family="'Charter', 'Georgia', serif">2.051</text>
      <text x="116" y="66" fill="#2dd4bf" font-size="20" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace">/ 2.051</text>
      <text x="208" y="66" fill="#64748b" font-size="18" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">(100% de acierto)</text>

      <!-- Bloque derecho: cero rechazos indebidos -->
      <text x="656" y="30" fill="#64748b" font-size="18" font-weight="500" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Falsos Positivos</text>
      <text x="656" y="66" fill="#2dd4bf" font-size="22" font-weight="800" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace">0 <tspan fill="#64748b" font-size="18" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">rechazos erróneos</tspan></text>
    </g>

    <!-- ================= FILA 2: CLIENTES QUE NO PAGAN (102 Clientes = 5%) ================= -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="680" height="96" rx="4" fill="#0b111a" stroke="#162030" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="96" rx="2" fill="#3b82f6"/>

      <!-- Cabecera de clase minoritaria -->
      <text x="24" y="28" fill="#94a3b8" font-size="18" font-weight="600" letter-spacing="0.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">CLIENTES QUE NO PAGAN</text>
      <text x="260" y="28" fill="#475569" font-size="18" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">· Clase crítica (5% total)</text>

      <!-- Barra visual proporcional depurada: 74 capturados (73%) vs 28 sin detectar (27%) -->
      <g transform="translate(24, 42)">
        <!-- Fondo de la barra total (102 clientes = 632 px ancho) -->
        <rect x="0" y="0" width="632" height="12" rx="6" fill="#1e293b"/>
        <!-- Segmento detectado (73% = 458 px) -->
        <rect x="0" y="0" width="458" height="12" rx="6" fill="url(#barTealGrad)"/>
        <!-- Pequeña línea divisoria interior en la barra -->
        <line x1="458" y1="0" x2="458" y2="12" stroke="#090d13" stroke-width="2"/>

        <!-- Métricas textuales alineadas bajo la barra -->
        <g transform="translate(0, 36)">
          <circle cx="6" cy="-6" r="4" fill="#2dd4bf"/>
          <text x="18" y="0" fill="#f8fafc" font-size="19" font-weight="800" font-family="'Charter', 'Georgia', serif">74</text>
          <text x="48" y="0" fill="#2dd4bf" font-size="18" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace">detectados</text>
          <text x="165" y="0" fill="#64748b" font-size="18" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">(Recall 73%)</text>

          <!-- Falsos negativos -->
          <circle cx="478" cy="-6" r="4" fill="#475569"/>
          <text x="490" y="0" fill="#94a3b8" font-size="19" font-weight="700" font-family="'Charter', 'Georgia', serif">28</text>
          <text x="520" y="0" fill="#64748b" font-size="18" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">no detectados</text>
        </g>
      </g>
    </g>

  </g>
</svg>